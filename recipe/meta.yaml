{% set name = "jsonrpcserver" %}
{% set version = "5.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4ae6de9734989a88843d98234d8bae62847f386589273c11a0a0f3f3d4558a45

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - flit-core >=3.12,<5
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - oslash <1
    - jsonschema <5

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - jsonrpcserver
  commands:
    - pip check

about:
  home: https://bensynapse.github.io/jsonrpcserver/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Process incoming JSON-RPC 2.0 requests in Python.
  doc_url: https://bensynapse.github.io/jsonrpcserver/
  dev_url: https://github.com/bensynapse/jsonrpcserver

extra:
  recipe-maintainers:
    - bcb
    - bensynapse
